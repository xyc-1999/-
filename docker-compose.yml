# ============================================================
#  enterprise-agent-system  基础设施编排
#  一键启动 MySQL 8.0 + Redis 7.0，并自动执行初始化 SQL
#
#  使用方法（项目根目录）：
#     docker compose up -d
#     docker compose ps
#     docker compose down -v   # -v 删除数据卷
# ============================================================

name: enterprise-agent-system

services:
  mysql:
    image: mysql:8.0
    container_name: agent-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DB:-enterprise_agent}
      MYSQL_USER: ${MYSQL_USER:-agent}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-agent123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 初始化 SQL：容器首次启动(数据卷为空)时会自动执行 *.sql
      - ./backend/sql:/docker-entrypoint-initdb.d:ro
      # 数据持久化
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - agent-net

  redis:
    image: redis:7.0-alpine
    container_name: agent-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-agent123456}
      --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-agent123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - agent-net

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  agent-net:
    driver: bridge